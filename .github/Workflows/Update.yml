name: 更新期权数据
on:
  schedule:
    - cron: "30 21 * * 1-5"   # 周一至周五 UTC 21:30，美股收盘后（北京时间次日 05:30 / 夏令时 04:30）
  workflow_dispatch:           # 允许手动点击运行
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python update_options.py
      - name: 提交最新数据
        run: |
          git config user.name "options-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.js
          git commit -m "update data" || echo "no changes"
          git push
