name: 更新期权数据
on:
  schedule:
    - cron: "*/30 13-21 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-options
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python update_options.py
      - name: 提交最新数据
        run: |
          git config user.name "options-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.js
          git commit -m "update data" || echo "no changes"
          git pull --rebase
          git push
